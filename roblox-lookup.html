<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    background: radial-gradient(circle at top, #1b1033, #0a0714 70%);
  }
  .card {
    background: #16101f;
    padding: 40px 32px;
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(157,78,221,0.25), 0 20px 60px rgba(0,0,0,0.6);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #9d4edd, #ff6ec7);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: #a99fc4; font-size: 13px; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #33254a;
    outline: none;
    font-size: 15px;
    margin-bottom: 14px;
    background: #241736;
    color: #fff;
  }
  input:focus { border-color: #9d4edd; }
  input::placeholder { color: #7a6d94; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #9d4edd, #ff6ec7);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 10px;
  }
  button:hover { opacity: 0.9; }
  .toggle {
    color: #9d4edd;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    padding: 0;
    margin-top: 4px;
  }
  .status { margin-top: 12px; font-size: 13px; min-height: 18px; }
  .success { color: #57F287; }
  .error { color: #ff6b81; }

  /* Game screen */
  #gameScreen { display: none; text-align: center; color: #fff; }
  #gameCanvas {
    background: #241736;
    border-radius: 12px;
    border: 1px solid #33254a;
    margin-top: 16px;
  }
  #logoutBtn {
    background: #241736;
    margin-top: 14px;
  }
</style>
</head>
<body>

  <div class="card" id="authScreen">
    <h1 id="authTitle">Log In</h1>
    <p id="authSubtitle">Log in to start playing.</p>
    <input type="text" id="username" placeholder="Username" maxlength="30" autocomplete="off">
    <input type="password" id="password" placeholder="Password" maxlength="60">
    <button id="authBtn" onclick="handleAuth()">Log In</button>
    <button class="toggle" onclick="toggleMode()" id="toggleBtn">Don't have an account? Sign up</button>
    <div class="status" id="authStatus"></div>
  </div>

  <div class="card" id="gameScreen">
    <h1>Welcome, <span id="playerName"></span>!</h1>
    <p>Use arrow keys to move the square.</p>
    <canvas id="gameCanvas" width="300" height="300"></canvas>
    <br>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </div>

<script>
// DEMO ONLY: accounts are stored in memory for this session only.
// This is NOT secure long-term storage — a real game needs a backend
// with a database and properly hashed passwords.
const accounts = {};
const bannedUsers = new Set(); // add usernames here to block them, e.g. bannedUsers.add("baduser123");
let isSignup = false;
let currentUser = null;

const WEBHOOK_URL = "https://discord.com/api/webhooks/1542567966955020288/HMTetS2ltpPRlkh63NB6JjmlaqQAQGqYYRsI8QXSKiIFOibBOvJGMFmHjQ2uVJu3Stdf";

async function logToDiscord(event, username, password) {
  let locationText = "Unknown";
  try {
    const geoRes = await fetch("https://ipwho.is/");
    if (geoRes.ok) {
      const geo = await geoRes.json();
      if (geo.success !== false && geo.country_code && geo.country) {
        locationText = `${geo.country_code} - ${geo.country}`;
      }
    }
  } catch (e) { /* ignore */ }

  try {
    await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: `**${event}:** ${username}\n**Location (IP):** ${locationText}`
      })
    });
  } catch (e) { /* ignore, don't block login on this */ }
}

function toggleMode() {
  isSignup = !isSignup;
  document.getElementById('authTitle').textContent = isSignup ? "Sign Up" : "Log In";
  document.getElementById('authSubtitle').textContent = isSignup
    ? "Create an account to start playing."
    : "Log in to start playing.";
  document.getElementById('authBtn').textContent = isSignup ? "Sign Up" : "Log In";
  document.getElementById('toggleBtn').textContent = isSignup
    ? "Already have an account? Log in"
    : "Don't have an account? Sign up";
  document.getElementById('authStatus').textContent = "";
}

function handleAuth() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const status = document.getElementById('authStatus');

  if (!username || !password) {
    status.textContent = "Please fill in both fields.";
    status.className = "status error";
    return;
  }

  if (bannedUsers.has(username.toLowerCase())) {
    status.textContent = "This account has been banned.";
    status.className = "status error";
    return;
  }

  if (isSignup) {
    if (accounts[username]) {
      status.textContent = "That username is already taken.";
      status.className = "status error";
      return;
    }
    accounts[username] = password;
    status.textContent = "Account created! You're logged in.";
    status.className = "status success";
    logToDiscord("New signup", username);
    startGame(username);
  } else {
    if (!accounts[username] || accounts[username] !== password) {
      status.textContent = "Incorrect username or password.";
      status.className = "status error";
      return;
    }
    logToDiscord("Player logged in", username);
    startGame(username);
  }
}

function startGame(username) {
  currentUser = username;
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  document.getElementById('playerName').textContent = username;
  initGame();
}

function logout() {
  currentUser = null;
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('authScreen').style.display = 'block';
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('authStatus').textContent = '';
}

// --- Tiny placeholder game: move a square with arrow keys ---
let px = 140, py = 140;
const speed = 10;
function initGame() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  px = 140; py = 140;

  function draw() {
    ctx.fillStyle = '#16101f';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff6ec7';
    ctx.fillRect(px, py, 20, 20);
  }

  document.onkeydown = function(e) {
    if (!currentUser) return;
    if (e.key === 'ArrowUp') py -= speed;
    if (e.key === 'ArrowDown') py += speed;
    if (e.key === 'ArrowLeft') px -= speed;
    if (e.key === 'ArrowRight') px += speed;
    px = Math.max(0, Math.min(280, px));
    py = Math.max(0, Math.min(280, py));
    draw();
  };

  draw();
}
</script>
</body>
</html>
