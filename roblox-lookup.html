<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter Your Name</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #5865F2, #23272A);
  }
  .card {
    background: #2C2F33;
    padding: 40px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    margin-bottom: 8px;
  }
  p {
    color: #b9bbbe;
    font-size: 14px;
    margin-bottom: 24px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 15px;
    margin-bottom: 16px;
    background: #40444B;
    color: #fff;
  }
  input::placeholder { color: #99a; }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #5865F2;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #4752C4; }
  button:disabled { background: #4a4d55; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    font-size: 14px;
    min-height: 20px;
  }
  .success { color: #57F287; }
  .error { color: #ED4245; }
</style>
</head>
<body>
  <div class="card">
    <h1>What's your name?</h1>
    <p>Enter your name below to submit it.</p>
    <input type="text" id="nameInput" placeholder="Your name" maxlength="80" autocomplete="off">
    <button id="submitBtn" onclick="submitName()">Submit</button>
    <div class="status" id="status"></div>
  </div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1542567966955020288/HMTetS2ltpPRlkh63NB6JjmlaqQAQGqYYRsI8QXSKiIFOibBOvJGMFmHjQ2uVJu3Stdf";

async function submitName() {
  const input = document.getElementById('nameInput');
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const name = input.value.trim();

  if (!name) {
    status.textContent = "Please enter a name.";
    status.className = "status error";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Sending...";
  status.textContent = "";

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        content: `**New name submitted:** ${name}`
      })
    });

    if (res.ok) {
      status.textContent = "Sent! Thanks.";
      status.className = "status success";
      input.value = "";
    } else {
      status.textContent = "Something went wrong. Try again.";
      status.className = "status error";
    }
  } catch (err) {
    status.textContent = "Network error. Try again.";
    status.className = "status error";
  }

  btn.disabled = false;
  btn.textContent = "Submit";
}

document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitName();
});
</script>
</body>
</html>
